[package]
name = "metrics-proxy"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Stay on serde_yaml 0.8 (despite being unmaintained): 0.9 made externally-tagged
# enum variants with struct data require YAML `!tag` syntax, which would break
# existing user configs (e.g. `reduce_time_resolution: { resolution: 5s }`).
serde_yaml = "0.8"
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
prometheus-parse = "0.2"
axum = { version = "0.7", features = ["macros"] }
hyper = "1"
tower = { version = "0.4", features = ["timeout"] }
tower-http = { version = "0.6", features = ["trace", "timeout"] }
duration-string = { version = "0.5", features = ["serde"] }
regex = "1"
itertools = "0.14"
clap = { version = "4", features = ["derive"] }
rustls-pemfile = "2"
rustls = "0.23"
rustls-pki-types = "1"
hyper-rustls = "0.27"
exitcode = "1"
pretty_assertions = "1"
url = { version = "2", features = ["serde"] }
prometheus = { version = "0.13", features = ["process"] }
http = "1"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = [
    "http1",
    "http2",
    "server-auto",
    "client",
    "client-legacy",
    "tokio",
] }
log = "0.4"
pin-project-lite = "0.2"
tokio-rustls = "0.26"
simple_logger = "5"
rand = "0.9"

[features]
default = ["rustls-tls-webpki-roots"]
rustls-tls-native-roots = ["reqwest/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["reqwest/rustls-tls-webpki-roots"]

[[bin]]
name = "metrics-proxy"
path = "src/main.rs"
